<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Waleed Al Ansari Launcher — Installer for Jetour G700</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0D12'/%3E%3Cpath d='M16 4l10 6v12l-10 6-10-6V10z' fill='none' stroke='%23E6F0FA' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M6 10l10 6 10-6M16 16v12' fill='none' stroke='%238CCBFF' stroke-width='1.4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="scene-glow scene-glow-a"></div>
    <div class="scene-glow scene-glow-b"></div>
    <div class="scene-ridge"></div>
  </div>

  <div class="shell">
    <aside class="rail glass glass-frosted" aria-label="Sections">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="bm-edge" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#F3F5F8"/><stop offset="1" stop-color="#7F8894"/>
            </linearGradient>
          </defs>
          <path d="M24 4l17 10v20L24 44 7 34V14z" fill="rgba(140,203,255,.08)" stroke="url(#bm-edge)" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M7 14l17 10 17-10M24 24v20" fill="none" stroke="#8CCBFF" stroke-width="1.3" stroke-linejoin="round" opacity=".9"/>
          <path d="M24 4v20" fill="none" stroke="#E6F0FA" stroke-width="1" opacity=".35"/>
        </svg>
        <div class="brand-text">
          <div class="brand-name" data-i18n="brand.name">Waleed Al Ansari Launcher</div>
          <div class="brand-sub" data-i18n="brand.sub">for Jetour G700</div>
        </div>
      </div>

      <nav class="tabs" id="tabs" role="tablist" aria-orientation="vertical"></nav>

      <div class="rail-foot">
        <div class="conn-pill" id="conn-pill" data-state="off">
          <span class="conn-dot" aria-hidden="true"></span>
          <span id="conn-pill-text" data-i18n="conn.off">Not connected</span>
        </div>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="en" lang="en">English</button>
          <button type="button" class="lang-btn" data-lang="ar" lang="ar">العربية</button>
        </div>
      </div>
    </aside>

    <main class="stage" id="stage">
      <div class="banner banner-warn" id="support-banner" hidden></div>

      <section class="view" id="view-connect" role="tabpanel" data-view="connect"></section>
      <section class="view" id="view-install" role="tabpanel" data-view="install" hidden></section>
      <section class="view" id="view-permissions" role="tabpanel" data-view="permissions" hidden></section>
      <section class="view" id="view-apps" role="tabpanel" data-view="apps" hidden></section>
      <section class="view" id="view-catalog" role="tabpanel" data-view="catalog" hidden></section>
      <section class="view" id="view-tools" role="tabpanel" data-view="tools" hidden></section>

      <details class="log glass glass-frosted" id="log">
        <summary>
          <span class="log-title" data-i18n="log.title">Activity log</span>
          <span class="log-count" id="log-count">0</span>
          <span class="log-hint" data-i18n="log.hint">every command sent to the car and its raw reply</span>
        </summary>
        <div class="log-tools">
          <button type="button" class="btn btn-quiet btn-small" id="log-copy" data-i18n="log.copy">Copy log</button>
          <button type="button" class="btn btn-quiet btn-small" id="log-clear" data-i18n="log.clear">Clear</button>
          <span class="log-note" data-i18n="log.note">The serial number is hidden in this log.</span>
        </div>
        <ol class="log-list" id="log-list" dir="ltr"></ol>
      </details>

      <footer class="foot">
        <span data-i18n="foot.local">Runs entirely in this browser. Nothing is uploaded; there is no telemetry.</span>
        <span data-i18n="foot.untested">Not yet verified on a real G700.</span>
      </footer>
    </main>
  </div>

  <dialog class="dialog glass glass-solid" id="dialog">
    <form method="dialog" class="dialog-body">
      <h2 id="dialog-title"></h2>
      <div id="dialog-content" class="dialog-content"></div>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="btn btn-quiet" id="dialog-cancel"></button>
        <button type="submit" value="ok" class="btn btn-primary" id="dialog-ok"></button>
      </div>
    </form>
  </dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">This installer needs JavaScript and desktop Chrome or Edge (WebUSB).</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
